- name: 运行登录
        env:
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          GH_PASSWORD: ${{ secrets.GH_PASSWORD }}
          GH_2FA_SECRET: ${{ secrets.GH_2FA_SECRET }}
        run: |
          cat << 'EOF' > run.py
          import os, time, pyotp
          from playwright.sync_api import sync_playwright

          def run():
              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True)
                  page = browser.new_page(viewport={'width': 1280, 'height': 800})
                  
                  try:
                      print("1. 正在打开 GitHub...")
                      page.goto("https://github.com/login", wait_until="networkidle")
                      
                      # 填表单
                      page.fill('input[name="login"]', os.environ['GH_USERNAME'])
                      page.fill('input[name="password"]', os.environ['GH_PASSWORD'])
                      
                      # 【暴力点击】：寻找所有可能的登录按钮，点第一个可见的
                      login_btn = page.locator('input[type="submit"], button[type="submit"], .js-sign-in-button').first
                      login_btn.click()
                      print("✅ 已点击登录按钮")
                      
                      time.sleep(5)
                      # 截图存档 1：登录后状态
                      page.screenshot(path="step1.png")

                      if "two-factor" in page.url:
                          print("⚠️ 发现 2FA 验证...")
                          # 尝试切换到验证码输入模式
                          try:
                              page.locator('button:has-text("More options"), a:has-text("Use an authentication app")').first.click(timeout=5000)
                              time.sleep(2)
                              page.locator('button:has-text("Use an authentication app")').first.click(timeout=5000)
                          except:
                              pass
                          
                          code = pyotp.TOTP(os.environ['GH_2FA_SECRET'].replace(' ', '')).now()
                          print(f"🔢 验证码: {code}")
                          
                          page.locator('input[autocomplete="one-time-code"], input[name="app_otp"]').first.fill(code)
                          page.keyboard.press("Enter")
                          time.sleep(8)

                      print("2. 跳转 ClawCloud...")
                      page.goto("https://console.run.claw.cloud", wait_until="networkidle")
                      
                      # 截图存档 2：ClawCloud 状态
                      page.screenshot(path="step2.png")

                      if "authorize" in page.url:
                          page.get_by_role("button", name="Authorize").first.click()
                          time.sleep(8)

                      if "claw.cloud" in page.url and "signin" not in page.url:
                          print("🎉 恭喜，登录保活大获成功！")
                      else:
                          print("❌ 登录结果存疑")
                          raise Exception("Failed to verify final page")

                  except Exception as e:
                      print(f"❌ 出错了: {e}")
                      page.screenshot(path="error.png")
                      raise e
                  finally:
                      browser.close()
          if __name__ == "__main__":
              run()
          EOF
          python run.py

      - name: 无论成功失败都把图发给我
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-images
          path: "*.png"

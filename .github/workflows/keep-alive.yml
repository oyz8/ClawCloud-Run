- name: 运行登录
        env:
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          GH_PASSWORD: ${{ secrets.GH_PASSWORD }}
          GH_2FA_SECRET: ${{ secrets.GH_2FA_SECRET }}
        run: |
          cat << 'EOF' > run.py
          import os, time, pyotp
          from playwright.sync_api import sync_playwright

          def run():
              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True)
                  context = browser.new_context(user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36")
                  page = context.new_page()
                  
                  try:
                      print("1. 访问登录页...")
                      page.goto("https://github.com/login")
                      page.get_by_label("Username or email address").fill(os.environ['GH_USERNAME'])
                      page.get_by_label("Password").fill(os.environ['GH_PASSWORD'])
                      
                      # 【精准修复】：只点击类型为 submit 的 Sign in 按钮，避开 Passkey 按钮
                      page.locator('input[type="submit"][name="commit"]').click()
                      
                      # 2. 处理 2FA 逻辑
                      time.sleep(5)
                      if "two-factor" in page.url:
                          print("⚠️ 检测到 2FA，尝试切换模式...")
                          
                          # 寻找并点击“More options”
                          try:
                              # 增加多种定位方式，确保能点开菜单
                              more_opt = page.get_by_role("button", name="More options").first
                              if more_opt.is_visible(timeout=5000):
                                  more_opt.click()
                                  time.sleep(2)
                                  page.get_by_role("button", name="Use your authentication app").click()
                                  print("✅ 已切换到验证码模式")
                                  time.sleep(2)
                          except:
                              print("💡 切换按钮未找到，可能已在填码页")

                          # 生成并填写验证码
                          secret = os.environ['GH_2FA_SECRET'].replace(' ', '')
                          code = pyotp.TOTP(secret).now()
                          print(f"🔢 自动填入验证码: {code}")

                          # 填码
                          otp_input = page.locator('input[autocomplete="one-time-code"], input[name="app_otp"]').first
                          otp_input.wait_for(state="visible", timeout=10000)
                          otp_input.fill(code)
                          page.keyboard.press("Enter")
                          time.sleep(10)

                      # 3. 访问 ClawCloud
                      print("🌐 访问 ClawCloud 控制台...")
                      page.goto("https://console.run.claw.cloud", wait_until="networkidle")
                      
                      if "authorize" in page.url:
                          print("🔘 点击授权...")
                          page.get_by_role("button", name="Authorize").click()
                          time.sleep(10)

                      if "claw.cloud" in page.url and "signin" not in page.url:
                          print("🎉 这一次真的成功了！")
                      else:
                          raise Exception("最终页面跳转失败")
                  
                  except Exception as e:
                      print(f"❌ 运行异常: {e}")
                      page.screenshot(path="fail.png")
                      raise e
                  finally:
                      browser.close()

          if __name__ == "__main__":
              run()
          EOF
          python run.py

- name: 写入自动化脚本
        run: |
          mkdir -p scripts
          cat << 'EOF' > scripts/auto_login.py
          import os
          import time
          import pyotp
          import requests
          from playwright.sync_api import sync_playwright

          def run_login():
              username = os.environ.get('GH_USERNAME')
              password = os.environ.get('GH_PASSWORD')
              otp_secret = os.environ.get('GH_2FA_SECRET', '').replace(' ', '')
              tg_token = os.environ.get('TG_BOT_TOKEN')
              tg_id = os.environ.get('TG_CHAT_ID')

              print(f"🚀 开始为用户 {username} 执行自动登录...")

              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True)
                  context = browser.new_context(viewport={'width': 1920, 'height': 1080})
                  page = context.new_page()

                  try:
                      # 1. 登录 GitHub
                      page.goto("https://github.com/login", timeout=60000)
                      page.fill('input[name="login"]', username)
                      page.fill('input[name="password"]', password)
                      page.click('input[type="submit"]')
                      time.sleep(5)

                      # 2. 处理 2FA
                      if "two-factor" in page.url:
                          print("🔐 检测到需要两步验证...")
                          
                          # 核心改进：强制寻找“使用验证码”的按钮并点击
                          otp_link = page.locator('button:has-text("use your authentication app"), a:has-text("Use an authentication app"), button:has-text("Enter a two-factor code")').first
                          if otp_link.is_visible():
                              print("🖱️ 正在切换到验证码输入模式...")
                              otp_link.click()
                              time.sleep(3)

                          if not otp_secret:
                              print("❌ 错误：未配置 GH_2FA_SECRET")
                              return
                          
                          totp = pyotp.TOTP(otp_secret)
                          code = totp.now()
                          print(f"✅ 已生成 TOTP 验证码")

                          # 尝试多种可能的输入框选择器
                          otp_input = page.locator('input[autocomplete="one-time-code"], input[name="app_otp"], #app_totp, #otp').first
                          otp_input.wait_for(state="visible", timeout=10000)
                          otp_input.fill(code)
                          page.keyboard.press("Enter")
                          print("📤 验证码已提交，等待页面跳转...")
                          time.sleep(8)

                      # 3. 访问 ClawCloud
                      print("🌐 访问 ClawCloud 控制台...")
                      page.goto("https://console.run.claw.cloud", timeout=60000)
                      time.sleep(5)

                      # 检查是否需要 OAuth 授权
                      if "github.com/login/oauth/authorize" in page.url:
                          print("🔘 正在进行 OAuth 授权...")
                          page.click('button[name="authorize"]')
                          time.sleep(8)

                      # 4. 结果判定
                      if "claw.cloud" in page.url and "signin" not in page.url:
                          print("🎉 登录保活成功！")
                          if tg_token and tg_id:
                              requests.post(f"https://api.telegram.org/bot{tg_token}/sendMessage", 
                                           data={"chat_id": tg_id, "text": "✅ ClawCloud 自动保活登录成功！"})
                      else:
                          raise Exception("未检测到登录成功的标志页面")

                  except Exception as e:
                      print(f"❌ 运行出错: {e}")
                      page.screenshot(path="fail.png")
                      if tg_token and tg_id:
                          requests.post(f"https://api.telegram.org/bot{tg_token}/sendMessage", 
                                       data={"chat_id": tg_id, "text": f"❌ ClawCloud 登录失败\n错误: {str(e)[:100]}"})
                      raise e # 重新抛出异常让 Action 显示失败状态
                  
                  finally:
                      browser.close()

          if __name__ == "__main__":
              run_login()
          EOF

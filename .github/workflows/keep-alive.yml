- name: 写入自动化脚本
        run: |
          mkdir -p scripts
          cat << 'EOF' > scripts/auto_login.py
          import os
          import time
          import pyotp
          import requests
          from playwright.sync_api import sync_playwright

          def run_login():
              username = os.environ.get('GH_USERNAME')
              password = os.environ.get('GH_PASSWORD')
              otp_secret = os.environ.get('GH_2FA_SECRET', '').replace(' ', '')
              tg_token = os.environ.get('TG_BOT_TOKEN')
              tg_id = os.environ.get('TG_CHAT_ID')

              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True)
                  context = browser.new_context()
                  page = context.new_page()

                  try:
                      print("🌐 正在登录 GitHub...")
                      page.goto("https://github.com/login")
                      page.fill('input[name="login"]', username)
                      page.fill('input[name="password"]', password)
                      page.click('input[type="submit"]')
                      time.sleep(5)

                      if "two-factor" in page.url:
                          print("⚠️ 检测到手机推送模式，正在尝试切换到验证码模式...")
                          
                          # 核心逻辑：点击 'More options' -> 点击 'Use an authentication app'
                          try:
                              page.click('button:has-text("More options"), .Button-label:has-text("More options")', timeout=5000)
                              time.sleep(2)
                              page.click('button:has-text("Use an authentication app"), .ActionList-item-label:has-text("Use an authentication app")')
                              print("✅ 已成功切换到验证码输入框")
                              time.sleep(3)
                          except Exception as e:
                              print(f"💡 尝试切换模式时遇到微调 (可能已经是验证码模式): {e}")

                          # 生成并填写验证码
                          totp = pyotp.TOTP(otp_secret)
                          code = totp.now()
                          print(f"🔢 生成验证码: {code}")
                          
                          otp_input = page.locator('input[autocomplete="one-time-code"], input[name="app_otp"]').first
                          otp_input.fill(code)
                          page.keyboard.press("Enter")
                          time.sleep(8)

                      # 访问 ClawCloud
                      print("🚀 访问 ClawCloud 控制台...")
                      page.goto("https://console.run.claw.cloud")
                      time.sleep(5)

                      if "github.com/login/oauth/authorize" in page.url:
                          page.click('button[name="authorize"]')
                          time.sleep(8)

                      if "claw.cloud" in page.url and "signin" not in page.url:
                          print("🎉 恭喜！全自动登录成功！")
                          if tg_token and tg_id:
                              requests.post(f"https://api.telegram.org/bot{tg_token}/sendMessage", 
                                           data={"chat_id": tg_id, "text": "✅ ClawCloud 自动保活登录成功！"})
                      else:
                          raise Exception("登录跳转失败，可能卡在了某个页面")

                  except Exception as e:
                      print(f"❌ 运行失败: {e}")
                      page.screenshot(path="fail.png")
                      raise e
                  finally:
                      browser.close()

          if __name__ == "__main__":
              run_login()
          EOF

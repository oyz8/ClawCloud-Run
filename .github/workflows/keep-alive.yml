# 这里的 name 决定了你在 Actions 页面左侧看到的名字
name: 🚀ClawCloud-全自动登录保活

on:
  schedule:
    - cron: '0 7 */5 * *'
  workflow_dispatch: # 这个能让你手动点击运行

jobs:
  auto-login:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install playwright requests pyotp
          playwright install chromium
          playwright install-deps

      - name: 写入并运行自动化脚本
        env:
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          GH_PASSWORD: ${{ secrets.GH_PASSWORD }}
          GH_2FA_SECRET: ${{ secrets.GH_2FA_SECRET }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          cat << 'EOF' > auto_run.py
          import os, time, pyotp, requests
          from playwright.sync_api import sync_playwright

          def run():
              un = os.environ.get('GH_USERNAME')
              pw = os.environ.get('GH_PASSWORD')
              secret = os.environ.get('GH_2FA_SECRET', '').replace(' ', '')
              
              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True)
                  page = browser.new_page()
                  
                  print("正在访问 GitHub...")
                  page.goto("https://github.com/login")
                  page.fill('input[name="login"]', un)
                  page.fill('input[name="password"]', pw)
                  page.click('input[type="submit"]')
                  time.sleep(5)

                  if "two-factor" in page.url:
                      print("检测到点数字模式，正在强制切换到验证码...")
                      try:
                          # 尝试点击 'More options'
                          page.click('button:has-text("More options")', timeout=5000)
                          time.sleep(2)
                          # 点击使用验证器
                          page.click('button:has-text("Use an authentication app")')
                          time.sleep(2)
                      except:
                          pass
                      
                      # 生成并填入 6 位码
                      code = pyotp.TOTP(secret).now()
                      print(f"自动填入验证码: {code}")
                      page.fill('input[autocomplete="one-time-code"]', code)
                      page.keyboard.press("Enter")
                      time.sleep(8)

                  print("正在跳转 ClawCloud...")
                  page.goto("https://console.run.claw.cloud")
                  time.sleep(5)

                  if "authorize" in page.url:
                      page.click('button[name="authorize"]')
                      time.sleep(8)

                  if "claw.cloud" in page.url:
                      print("✅ 登录成功！")
                  else:
                      print("❌ 登录失败")
                      page.screenshot(path="fail.png")
                      raise Exception("Login failed")
                  browser.close()

          if __name__ == "__main__":
              run()
          EOF
          python auto_run.py
